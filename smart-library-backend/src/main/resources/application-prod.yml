server:
  port: 8080

spring:
  application:
    name: smart-library-backend
  datasource:
    # 全部走环境变量，部署时不再把数据库密码写进代码仓库
    # Linux 示例：export DB_URL='jdbc:mysql://127.0.0.1:3306/smart_library?...'
    url: "${DB_URL:jdbc:mysql://localhost:3306/smart_library?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${DB_USERNAME:smartlib}"
    password: "${DB_PASSWORD:SmartLib@123456}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: "${JWT_SECRET:smart-library-prod-secret-key-please-change-after-deploy}"
  expiration: "${JWT_EXPIRATION:86400000}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"
  allowed-methods: "*"
  allowed-headers: "*"
