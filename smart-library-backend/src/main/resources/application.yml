server:
  port: 8080

spring:
  application:
    name: smart-library-backend
  datasource:
    # 配置外置：优先读环境变量，读不到就用下面括号里的本地默认值
    url: "${DB_URL:jdbc:mysql://localhost:3306/smart_library?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:root}"
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: "${JWT_SECRET:smart-library-secret-key-2024-very-long-and-secure}"
  expiration: "${JWT_EXPIRATION:86400000}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:*}"
  allowed-methods: "*"
  allowed-headers: "*"
