server:
  port: 8080

spring:
  application:
    name: smart-library-backend-demo
  datasource:
    url: jdbc:h2:file:./data/smart_library;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: smart-library-secret-key-2024-very-long-and-secure
  expiration: 86400000

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
